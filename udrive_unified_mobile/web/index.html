<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Udrive customer and driver tourism app for Azad Kashmir.">
  <meta name="theme-color" content="#087A55">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Udrive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon-v2.png?v=20260730"/>
  <link rel="manifest" href="manifest.json">
  <title>Udrive</title>

  <!-- Google Maps JavaScript API.
       Required for google_maps_flutter on the WEB build only. The Android APK
       reads its key from AndroidManifest.xml instead; see REDESIGN_HANDOVER.md.

       Replace YOUR_WEB_MAPS_API_KEY below with your Maps JavaScript API key,
       then restrict that key in Google Cloud Console to your site's domains
       (HTTP referrers) so nobody else can spend your quota.

       Until the key is filled in, map screens fall back to the offline
       OpenStreetMap layer rather than breaking. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_WEB_MAPS_API_KEY"></script>

  <script>
    // Google Maps reports authentication problems by calling this global and
    // by logging to the console — it never tells the Flutter side. Without it,
    // a rejected key looks identical to a slow network: grey tiles, no reason.
    //
    // This surfaces the reason on the page itself, so the cause is visible
    // without opening devtools on a phone.
    window.gm_authFailure = function () {
      var box = document.createElement('div');
      box.style.cssText = [
        'position:fixed', 'left:12px', 'right:12px', 'bottom:12px',
        'z-index:99999', 'background:#3A2E14', 'color:#FFC96B',
        'border:1px solid #FFB84D', 'border-radius:12px', 'padding:12px 14px',
        'font:13px/1.5 system-ui,sans-serif'
      ].join(';');
      box.innerHTML =
        '<b>Google Maps rejected the key.</b><br>' +
        'Usually the site is missing from the key&rsquo;s website ' +
        'restrictions, or billing is off. Current origin:<br><code>' +
        window.location.origin + '</code>';
      document.body.appendChild(box);
      console.error('[UDrive] gm_authFailure — origin:', window.location.origin);
    };

    // Maps also logs its specific error name (RefererNotAllowedMapError and
    // friends) rather than throwing. Mirror those onto the page too.
    (function () {
      var originalError = console.error;
      console.error = function () {
        var text = Array.prototype.join.call(arguments, ' ');
        if (text.indexOf('MapError') !== -1 || text.indexOf('Google Maps') !== -1) {
          var box = document.getElementById('udrive-map-error');
          if (!box) {
            box = document.createElement('div');
            box.id = 'udrive-map-error';
            box.style.cssText = [
              'position:fixed', 'left:12px', 'right:12px', 'top:12px',
              'z-index:99999', 'background:#3A1A18', 'color:#FF9A8F',
              'border:1px solid #FF5A4E', 'border-radius:12px',
              'padding:10px 12px', 'font:12px/1.45 system-ui,sans-serif',
              'max-height:40vh', 'overflow:auto'
            ].join(';');
            document.body.appendChild(box);
          }
          box.textContent = 'Maps: ' + text;
        }
        originalError.apply(console, arguments);
      };
    })();
  </script>
</head>
<body>
  <script>
    // Clear old Udrive PWA caches after branding/release updates.
    const release = 'udrive-20260730-v2';
    if (localStorage.getItem('udrive_release') !== release) {
      localStorage.setItem('udrive_release', release);
      if ('caches' in window) caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.update()));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
