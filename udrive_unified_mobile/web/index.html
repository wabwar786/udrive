<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Udrive customer and driver tourism app for Azad Kashmir.">
  <meta name="theme-color" content="#087A55">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Udrive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon-v2.png?v=20260730"/>
  <link rel="manifest" href="manifest.json">
  <title>Udrive</title>

  <!-- Google Maps JavaScript API.
       Required for google_maps_flutter on the WEB build only. The Android APK
       reads its key from AndroidManifest.xml instead; see REDESIGN_HANDOVER.md.

       Replace YOUR_WEB_MAPS_API_KEY below with your Maps JavaScript API key,
       then restrict that key in Google Cloud Console to your site's domains
       (HTTP referrers) so nobody else can spend your quota.

       Until the key is filled in, map screens fall back to the offline
       OpenStreetMap layer rather than breaking. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_WEB_MAPS_API_KEY"></script>
</head>
<body>
  <script>
    // Clear old Udrive PWA caches after branding/release updates.
    const release = 'udrive-20260730-v2';
    if (localStorage.getItem('udrive_release') !== release) {
      localStorage.setItem('udrive_release', release);
      if ('caches' in window) caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.update()));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
