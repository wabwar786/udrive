name: udrive_mobile
publish_to: "none"
description: Premium unified Udrive customer and driver app for Azad Kashmir tourism.
version: 9.0.0+10

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  file_picker: ^11.0.2
  battery_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  google_maps_flutter: ^2.10.0
  share_plus: ^11.0.0
  # Blocks pointer events from reaching HtmlElementView platform views on web.
  # Without it, dragging anything drawn over the Google Map still pans the map,
  # because the map is a DOM element in its own layer rather than part of
  # Flutter's canvas.
  pointer_interceptor: ^0.10.1+2
  url_launcher: ^6.3.2
  record: ^6.2.1
  google_fonts: ^8.2.0
  flutter_map_pmtiles: ^1.0.5
  disk_space_plus: ^0.2.6
  crypto: ^3.0.7
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home_services/
    - assets/vehicles/
    - assets/vehicles_photo/
