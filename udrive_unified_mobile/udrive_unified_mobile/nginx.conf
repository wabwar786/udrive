server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # The app bundle. Flutter emits the same filenames on every build, so an
  # immutable cache means a browser keeps running an old app after a deploy —
  # which is how a build labelled rev 28 survived two releases of rev 29.
  #
  # must-revalidate lets nginx answer 304 when nothing changed, so this costs a
  # conditional request rather than a re-download.
  location ~* ^/(main\.dart\.js|flutter\.js|flutter_bootstrap\.js|version\.json)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }


  location ^~ /assets/images/ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location ^~ /icons/ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Content-hashed assets (canvaskit, fonts) are safe to cache hard: their
  # filenames change when their contents do.
  location ~* \.(css|png|jpg|jpeg|gif|ico|svg|webp|wasm)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Remaining JS revalidates rather than being pinned for a week.
  location ~* \.js$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }
}
