name: Print SHA-1 fingerprint

# Run this by hand from the Actions tab when you need a SHA-1 for a Google Maps
# Android API key restriction. It builds nothing and publishes nothing — it only
# prints the fingerprint of whichever key this checkout can sign with.
#
# READ THIS BEFORE YOU COPY ANYTHING OUT OF THE LOG.
#
# An app published through Google Play is re-signed by Play App Signing. The
# certificate that ends up on the user's phone is Google's, not the upload key
# you built with, so the SHA-1 Maps has to trust is the one in
#   Play Console → your app → Test and release → Setup → App signing
#   → "App signing key certificate" → SHA-1.
# That value cannot be printed from this repository. It exists only after the
# first bundle has been uploaded.
#
# So, in the Maps key's Android restriction, add package com.wabwar.udrive with:
#   1. the Play App Signing SHA-1  — REQUIRED, or the map is blank for every
#      user who installs from Play;
#   2. the upload key's SHA-1      — so an internal-testing build you sideload
#      also shows the map;
#   3. the debug SHA-1             — only if you want `flutter run` to show it
#      on a development machine. Never on its own.
#
# This workflow prints 2 and 3. Get 1 from the Play Console.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha1:
    name: Show package name and SHA-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: udrive_unified_mobile
        run: flutter pub get

      - name: Package name
        working-directory: udrive_unified_mobile
        run: |
          echo "=============================================="
          echo "PACKAGE NAME (applicationId):"
          grep -R "applicationId" android/app/build.gradle.kts || true
          echo "=============================================="

      - name: SHA-1 fingerprint
        working-directory: udrive_unified_mobile/android
        env:
          UDRIVE_KEYSTORE_PATH: ${{ secrets.UDRIVE_KEYSTORE_PATH }}
          UDRIVE_KEYSTORE_PASSWORD: ${{ secrets.UDRIVE_KEYSTORE_PASSWORD }}
          UDRIVE_KEY_ALIAS: ${{ secrets.UDRIVE_KEY_ALIAS }}
          UDRIVE_KEY_PASSWORD: ${{ secrets.UDRIVE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew || true
          ./gradlew signingReport --no-daemon | tee report.txt
          echo ""
          echo "=============================================="
          echo "Variant: release  → this is the UPLOAD key."
          echo "Variant: debug    → development machines only."
          echo ""
          echo "The SHA-1 that Play-installed apps use is NOT here."
          echo "Take it from Play Console → Setup → App signing."
          echo "=============================================="
          grep -B 2 -A 6 "Variant: release" report.txt | grep -E "Variant|SHA1" || true
          grep -B 2 -A 6 "Variant: debug" report.txt | grep -E "Variant|SHA1" || true
