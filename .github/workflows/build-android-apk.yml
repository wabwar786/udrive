name: Build UDrive

on:
  # The Run workflow form. Both boxes may be left empty: the name then comes
  # from pubspec.yaml and the code is computed below.
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown on Play, e.g. 9.1.0. Empty = whatever pubspec.yaml says."
        required: false
        type: string
      version_code:
        description: "Version code. Empty = automatic, and automatic never repeats a number."
        required: false
        type: string
      note:
        description: "What this build is for. Appears in the run summary."
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "udrive_unified_mobile/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  # Worked out once, in one place, so the APK and the bundle in the same run
  # can never carry different numbers.
  version:
    name: Decide the version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      code: ${{ steps.pick.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        name: Work out the version name and code
        env:
          IN_NAME: ${{ inputs.version_name }}
          IN_CODE: ${{ inputs.version_code }}
          # Through the environment, never interpolated into the script. A note
          # containing a quote or a backtick would otherwise be pasted straight
          # into the shell.
          IN_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail

          # pubspec holds "version: 9.0.0+10".
          PUBSPEC=$(grep -m1 '^version:' udrive_unified_mobile/pubspec.yaml | sed 's/^version:[[:space:]]*//')
          PUB_NAME="${PUBSPEC%%+*}"
          PUB_CODE="${PUBSPEC##*+}"

          NAME="${IN_NAME:-$PUB_NAME}"

          if [ -n "${IN_CODE:-}" ]; then
            case "$IN_CODE" in
              ''|*[!0-9]*)
                echo "::error::version_code must be a whole number. Got '$IN_CODE'."
                exit 1 ;;
            esac
            # Play refuses a code it has already seen, and it has seen
            # everything up to the number in pubspec. Failing here costs
            # seconds; failing at the upload costs the whole build.
            if [ "$IN_CODE" -le "$PUB_CODE" ]; then
              echo "::error::version_code $IN_CODE is not above $PUB_CODE, which Play has already had. Use a higher number, or leave the box empty for an automatic one."
              exit 1
            fi
            CODE="$IN_CODE"
          else
            # run_number only ever increases, so this can never hand out the
            # same code twice, and adding the pubspec code keeps it above
            # everything already uploaded.
            CODE=$(( PUB_CODE + GITHUB_RUN_NUMBER ))
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          {
            echo "## UDrive $NAME ($CODE)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version name | \`$NAME\` |"
            echo "| Version code | \`$CODE\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| pubspec says | \`$PUBSPEC\` |"
            if [ -n "${IN_NOTE:-}" ]; then echo "| Note | $IN_NOTE |"; fi
            echo
            echo "Download **udrive-$NAME-$CODE.aab** from the Artifacts below, then Play Console → Closed testing → your track → Create new release."
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs first and fastest. If the code does not compile, this fails in about a
  # minute instead of waiting on a full APK build to discover the same thing.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: udrive_unified_mobile
        run: flutter pub get

      # Errors still fail the run - that is the whole point of this job. Warnings
      # and infos do not: `flutter analyze` makes both fatal by default, and the
      # app carries ~46 unused-declaration and unused-import warnings that block
      # every release without indicating anything broken. Clean them up as you
      # touch those files; do not let them hold a build hostage.
      - name: Analyze
        working-directory: udrive_unified_mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: udrive_unified_mobile
        run: flutter pub get

      # The Maps JavaScript key lives in a repository secret, never in git.
      # Settings -> Secrets and variables -> Actions -> New repository secret
      #   Name:  MAPS_WEB_KEY
      # If the secret is unset the placeholder stays and the map area is blank,
      # but the rest of the app still builds and runs.
      - name: Inject Maps web key
        working-directory: udrive_unified_mobile
        env:
          MAPS_WEB_KEY: ${{ secrets.MAPS_WEB_KEY }}
        run: |
          if [ -n "$MAPS_WEB_KEY" ]; then
            sed -i "s|YOUR_WEB_MAPS_API_KEY|$MAPS_WEB_KEY|g" web/index.html
            echo "Maps web key injected."
          else
            echo "MAPS_WEB_KEY secret not set - map will render blank."
          fi

      - name: Build web
        working-directory: udrive_unified_mobile
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: udrive-web
          path: udrive_unified_mobile/build/web
          if-no-files-found: error
          retention-days: 30

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze, version]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files when missing
        working-directory: udrive_unified_mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --project-name=udrive_mobile \
              --org=com.wabwar
          fi

      - name: Install dependencies
        working-directory: udrive_unified_mobile
        run: flutter pub get

      # Repository secret MAPS_ANDROID_KEY, read by the manifestPlaceholder in
      # android/app/build.gradle.kts. Absent key still builds; map stays blank.
      #
      # The APK is signed with the SAME upload key as the Play bundle, when the
      # keystore secrets exist. Without them Gradle falls back to the debug key,
      # and a debug-signed APK has a SHA-1 that is generated on the runner and
      # differs every time - so it can never match the Android restriction on the
      # Maps key, and the map renders as an empty grey canvas with nothing but
      # the Google watermark. Signing with the upload key makes the test APK
      # match the SHA-1 registered in Google Cloud Console.
      - name: Build release APK
        working-directory: udrive_unified_mobile
        env:
          MAPS_ANDROID_KEY: ${{ secrets.MAPS_ANDROID_KEY }}
          UDRIVE_KEYSTORE_BASE64: ${{ secrets.UDRIVE_KEYSTORE_BASE64 }}
          UDRIVE_KEYSTORE_PASSWORD: ${{ secrets.UDRIVE_KEYSTORE_PASSWORD }}
          UDRIVE_KEY_ALIAS: ${{ secrets.UDRIVE_KEY_ALIAS }}
          UDRIVE_KEY_PASSWORD: ${{ secrets.UDRIVE_KEY_PASSWORD }}
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_CODE: ${{ needs.version.outputs.code }}
        run: |
          if [ -n "$UDRIVE_KEYSTORE_BASE64" ]; then
            echo "$UDRIVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            export UDRIVE_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
            echo "Signing the APK with the upload key."
          else
            echo "::warning::No keystore secrets - APK will be debug-signed and the map will not load."
          fi
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_CODE" \
            --dart-define=DEFAULT_MODE=customer \
            --dart-define=UDRIVE_FLAVOR=apk \
            --dart-define=API_BASE_URL=https://udrive-api-production.up.railway.app \
            -Pmaps_key="$MAPS_ANDROID_KEY"
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: udrive-mobile-apk
          path: udrive_unified_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # Google Play upload bundle (.aab). Needs four repository secrets:
  #   UDRIVE_KEYSTORE_BASE64   base64 of upload-keystore.jks
  #   UDRIVE_KEYSTORE_PASSWORD
  #   UDRIVE_KEY_ALIAS         (upload)
  #   UDRIVE_KEY_PASSWORD
  # Without them this job is skipped with a notice; Play rejects unsigned or
  # debug-signed bundles, so there is no point building one.
  build-aab:
    name: Build Play Store bundle
    runs-on: ubuntu-latest
    needs: [analyze, version]
    env:
      HAS_KEY: ${{ secrets.UDRIVE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Skip when no upload key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::UDRIVE_KEYSTORE_BASE64 secret not set - Play bundle skipped."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: subosito/flutter-action@v2
        if: env.HAS_KEY == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        working-directory: udrive_unified_mobile
        run: flutter pub get

      - name: Build signed app bundle
        if: env.HAS_KEY == 'true'
        working-directory: udrive_unified_mobile
        env:
          UDRIVE_KEYSTORE_BASE64: ${{ secrets.UDRIVE_KEYSTORE_BASE64 }}
          UDRIVE_KEYSTORE_PASSWORD: ${{ secrets.UDRIVE_KEYSTORE_PASSWORD }}
          UDRIVE_KEY_ALIAS: ${{ secrets.UDRIVE_KEY_ALIAS }}
          UDRIVE_KEY_PASSWORD: ${{ secrets.UDRIVE_KEY_PASSWORD }}
          MAPS_ANDROID_KEY: ${{ secrets.MAPS_ANDROID_KEY }}
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_CODE: ${{ needs.version.outputs.code }}
        run: |
          echo "$UDRIVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          export UDRIVE_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          # --build-name/--build-number override pubspec for this build only,
          # so shipping a new version no longer needs a commit.
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_CODE" \
            --dart-define=DEFAULT_MODE=customer \
            --dart-define=API_BASE_URL=https://udrive-api-production.up.railway.app \
            -Pmaps_key="$MAPS_ANDROID_KEY"
          rm -f "$UDRIVE_KEYSTORE_PATH"
          # Named so three downloads cannot be mixed up.
          mv build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/udrive-$BUILD_NAME-$BUILD_CODE.aab"

      - name: Upload bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: udrive-play-bundle-${{ needs.version.outputs.name }}-${{ needs.version.outputs.code }}
          path: udrive_unified_mobile/build/app/outputs/bundle/release/udrive-*.aab
          if-no-files-found: error
          retention-days: 30
